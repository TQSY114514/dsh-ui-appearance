# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 配置 — dsh-ui-appearance
# 目标：聚焦高价值审查 + 减少文档/锁文件噪音
# 更多字段参考: https://docs.coderabbit.ai/reference/configuration

language: "zh-CN"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  # 忽略文档与依赖锁文件，降低审查噪音
  path_filters:
    - "!**/CHANGELOG.md"
    - "!**/README*.md"
    - "!**/docs/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"

  path_instructions:
    - path: "src/**"
      instructions: |
        DSH 外观定制插件源码。保持插件兼容性，不引入破坏性变更。
        修改外观/配置时需保证与现有用户配置向下兼容。
    - path: "src/client/**"
      instructions: |
        Client 端渲染逻辑。保持与插件主目录稳定衔接，
        不随意改动已公开的配置结构与默认行为。

chat:
  auto_reply: true
