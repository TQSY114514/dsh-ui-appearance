version: 2
updates:
  # Dependabot has no `pnpm` ecosystem; the npm ecosystem detects
  # pnpm-lock.yaml and manages the pnpm dependency tree.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
