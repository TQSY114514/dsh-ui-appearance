version: 2
updates:
  # Dependabot has no `pnpm` ecosystem; the npm ecosystem detects
  # pnpm-lock.yaml and manages the pnpm dependency tree.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Host provides React 18 at runtime; keep peer/dev aligned on 18.x.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      # Keep vitest on 4.x.
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: "@vitest/*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
