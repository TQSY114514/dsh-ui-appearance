name: build

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Promise.withResolvers (used by the tsdown/rolldown chain) is a
          # Node 22+ API; the harness ecosystem targets ^22.19 || >=24.
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm prepare
      - name: Verify build artifacts
        run: |
          test -f lib/index.js
          test -f lib/invariant.js
          test -f lib/client.js
          test -f lib/index.d.ts
          test -f lib/invariant.d.ts
          test -f lib/client.d.ts
          echo "all artifacts present"
